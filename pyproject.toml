[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cellguard-data-collector"
version = "0.3.0"
description = "CellGuard Raspberry Pi collector: Nano UART (protocol v1.0) + INA219, experiment control, local spool for upload"
authors = [{ name = "Yongho Ahn", email = "nanhosoft@gmail.com" }]
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
pi = ["smbus2>=0.4"]
yaml = ["pyyaml>=6"]
dev = ["pytest>=8", "jsonschema>=4.20", "pyyaml>=6"]

[project.scripts]
cg-collect = "cg_collector.cli:main"

[tool.setuptools]
packages = ["cg_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
